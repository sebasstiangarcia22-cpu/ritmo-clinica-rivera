<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ritmo Clínica Rivera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
:root{
  --ground:#f5f7f6; --surface:#fff; --surface-2:#eef1f0;
  --ink:#0f1a18; --ink-2:#5a6764; --ink-3:#8b9895;
  --line:#dde3e1; --line-strong:#c4ccca;
  --now:#2a78d6; --record:#eb6834; --good:#1baf7a; --bad:#e34948;
  --faint:#b9c3c0; --meta:#8b9895;
  --shadow:0 1px 2px rgba(15,26,24,.05),0 8px 24px -12px rgba(15,26,24,.12);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --serif:'IBM Plex Serif',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121615; --surface:#1a201e; --surface-2:#232a28;
  --ink:#eef2f0; --ink-2:#9fadaa; --ink-3:#74827f;
  --line:#2a322f; --line-strong:#3a4441;
  --now:#3987e5; --record:#d95926; --good:#199e70; --bad:#e66767;
  --faint:#4a5451; --meta:#74827f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --ground:#121615; --surface:#1a201e; --surface-2:#232a28;
  --ink:#eef2f0; --ink-2:#9fadaa; --ink-3:#74827f;
  --line:#2a322f; --line-strong:#3a4441;
  --now:#3987e5; --record:#d95926; --good:#199e70; --bad:#e66767;
  --faint:#4a5451; --meta:#74827f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:14px}
img{max-width:100%}
.wrap{max-width:1000px;margin:0 auto;padding:38px 26px 56px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
h1{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:5px 0 0}

.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:20px;
  flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line-strong)}
.stamp{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}

.hero{padding:32px 0 4px}
.verdict{font-family:var(--serif);font-size:clamp(25px,3.7vw,38px);font-weight:600;
  line-height:1.22;letter-spacing:-.018em;margin:13px 0 0;text-wrap:balance;max-width:20ch}
.verdict em{font-style:normal;color:var(--now)}
.heroline{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:24px}
.bignum{font-size:clamp(36px,5.6vw,54px);font-weight:600;letter-spacing:-.035em;line-height:1}
.bigsub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.03em;
  padding-bottom:6px}
.rank{display:inline-flex;background:var(--now);color:#fff;border-radius:3px;padding:5px 10px;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;align-self:center}

.split{margin-top:20px;max-width:470px}
.split-bar{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface-2)}
.split-bar span{display:block;height:100%}
.split-k{display:flex;justify-content:space-between;gap:18px;margin-top:10px;
  font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.split-k i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:7px;vertical-align:baseline}
.split-k b{color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px;margin-top:28px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  padding:17px 17px 15px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.tile-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.delta{font-size:26px;font-weight:600;letter-spacing:-.022em;line-height:1;
  display:flex;align-items:baseline;gap:6px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.delta .arrow{font-size:15px}
.tile-f{font-family:var(--mono);font-size:11px;color:var(--ink-2);line-height:1.6;
  border-top:1px solid var(--line);padding-top:9px;margin-top:auto}
.tile-f b{color:var(--ink);font-weight:500}

section{margin-top:46px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  flex-wrap:wrap;margin-bottom:4px}
.sec-t{font-size:18px;font-weight:600;letter-spacing:-.016em;margin:0}
.sec-d{color:var(--ink-2);font-size:13px;margin:5px 0 0;max-width:58ch}

.seg{display:inline-flex;background:var(--surface-2);border-radius:4px;padding:2px;gap:2px}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  font-weight:500;border:0;background:transparent;color:var(--ink-2);padding:6px 12px;
  border-radius:3px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.09);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--now);outline-offset:1px}

.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  margin-top:16px;box-shadow:var(--shadow);overflow:hidden}
.chart-box{position:relative;padding:16px 14px 4px}
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;padding:13px 18px 15px;
  border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;
  color:var(--ink-2);align-items:center}
.lg{display:inline-flex;align-items:center;gap:7px}
.sw{width:15px;height:2.5px;border-radius:2px;flex:none}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;
  box-shadow:0 6px 22px -8px rgba(0,0,0,.3);padding:9px 11px;font-family:var(--mono);
  font-size:11px;min-width:150px;z-index:5;line-height:1.7}
.tip .th{font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);
  padding-bottom:5px;margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase;font-size:10px}
.tip .tr{display:flex;justify-content:space-between;gap:16px;color:var(--ink-2)}
.tip .tr.on{color:var(--ink);font-weight:600}
.tip .tk{display:flex;align-items:center;gap:6px}
.tip .td{width:7px;height:7px;border-radius:50%;flex:none}

.bars{margin-top:18px;display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:76px 1fr 124px;align-items:center;gap:13px;
  padding:7px 0;border-bottom:1px solid var(--line)}
.bar:last-child{border-bottom:0}
.bar .bl{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.03em}
.bar.hi .bl,.bar.hi .bv{color:var(--ink);font-weight:600}
.bar .track{height:18px;display:flex;gap:2px}
.bar .fill{height:100%;background:var(--faint);display:block}
.bar .fill:last-child{border-radius:0 3px 3px 0}
.bar .fill.sub{opacity:.36}
.bar.hi .fill{background:var(--now)}
.bar.rec .fill{background:var(--record)}
.bar .bv{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2)}

.notes{margin-top:44px;border-top:1px solid var(--line-strong);padding-top:22px}
.notes h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 14px;font-weight:600}
.note{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note:last-child{border-bottom:0}
.note .k{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3);padding-top:2px}
.note b{color:var(--ink);font-weight:600}
footer{margin-top:34px;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  line-height:1.7;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:600px){
  .wrap{padding:26px 16px 44px}
  .bar{grid-template-columns:60px 1fr 90px;gap:9px}
  .bar .bv{font-size:11px}
}

.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line)}
.controls label{display:flex;flex-direction:column;gap:5px;color:var(--ink-2);font-size:12px}
.controls select,.controls input,.action{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:8px 10px;min-height:38px}
.controls input{width:76px}.action{cursor:pointer}.action:disabled{opacity:.6;cursor:wait}
.controls select:focus-visible,.action:focus-visible,input:focus-visible{outline:2px solid var(--now);outline-offset:2px}
#status{font-size:12px;color:var(--ink-2);min-height:18px;margin-top:6px}
.warning{background:var(--surface-2);border-left:3px solid var(--record);padding:10px 12px;color:var(--ink);font-size:12px}
.split{max-width:none}.split-k{flex-wrap:wrap;justify-content:flex-start}.split-k span{display:inline-block}
#operations{color:var(--ink-2);margin-top:16px;font-size:13px}
.hero{padding-top:12px}.verdict{max-width:none}.chart-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.capture .wrap{max-width:1100px;padding-top:18px}.capture .hero{padding-top:0}.capture section{margin-top:24px}.capture .notes{display:none}.capture .chart-box{max-width:740px;margin:auto}.capture .controls{padding:8px 0}.capture #status{display:none}
[hidden]{display:none!important}
@media(max-width:600px){.controls{gap:8px}.controls label{flex:1;min-width:130px}.controls select{width:100%}.split-k{flex-direction:column;gap:8px}.bar{grid-template-columns:80px 1fr 115px}.tiles{grid-template-columns:1fr}.verdict{font-size:27px}}
@media print{.controls,#status,.chart-tools,.notes{display:none}.wrap{padding:0}.tile,.chart-card{box-shadow:none}section{break-inside:avoid}}
</style>
</head>
<body data-propio="Consultorio">
<div class="wrap">
  <div class="masthead">
    <div>
      <div class="eyebrow">Clínica Dr. Daniel Rivera</div>
      <h1>Ventas, origen y comparación mensual</h1>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>

  <div class="controls" aria-label="Filtros del informe">
    <label>Mes del informe<select id="periodo"></select></label>
    <label>Comparar<select id="modo"><option value="dia">Al mismo día</option><option value="completo">Mes completo</option></select></label>
    <label id="dayControl">Día de corte<input id="dia" type="number" min="1" max="31"></label>
    <button class="action" id="refresh" type="button">Actualizar datos</button>
    <button class="action" id="capture" type="button" aria-pressed="false">Vista para captura</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <p id="notice" class="warning" hidden></p>
  <div class="hero">
    <p class="verdict" id="verdict"></p>
    <div class="heroline">
      <div>
        <div class="bignum" id="heroNum"></div>
        <div class="bigsub" id="heroSub"></div>
      </div>
      <div class="rank" id="rank"></div>
    </div>
    <div class="split" id="split"></div>
    <div id="operations"></div><div class="tiles" id="tiles"></div>
  </div>

  <section>
    <div class="sec-h">
      <div>
        <h2 class="sec-t">La carrera, día por día</h2>
        <p class="sec-d" id="chartDesc">Acumulado por día del mes.</p>
      </div>
      <div class="chart-tools"><label><input type="checkbox" id="historial"> Ver historial</label><div class="seg" role="group" aria-label="Métrica">
        <button type="button" data-m="ventas" aria-pressed="true">Ventas</button>
        <button type="button" data-m="leads" aria-pressed="false">Leads</button>
        <button type="button" data-m="agend" aria-pressed="false">Agendas</button>
      </div></div>
    </div>
    <div class="chart-card">
      <div class="chart-box" id="chartBox">
        <svg id="chart" viewBox="0 0 900 380" role="img" aria-labelledby="chartTitle">
          <title id="chartTitle">Ventas acumuladas por día del mes</title>
        </svg>
        <div class="tip" id="tip"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section>
    <h2 class="sec-t" id="barsTitle">Comparación mensual</h2><p class="sec-d" id="barsDesc"></p>
    <div class="bars" id="bars"></div>
  </section>

  <div class="notes">
    <h2>Lectura</h2>
    <div id="notes"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
// All comparisons are based on the selected period, never on a later month.
function resumenPeriodo(P, seleccionado, modo, dia) {
  const calendario = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const meses = Object.keys(P.ventas || {}).sort((a,b)=>calendario.indexOf(a)-calendario.indexOf(b));
  const fecha = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'numeric'}).formatToParts(new Date());
  const anioActual = Number(fecha.find(x=>x.type==='year').value), mesActual = Number(fecha.find(x=>x.type==='month').value)-1;
  const periodo = m => {
    const anio=P.anio || 2026, indice=calendario.indexOf(m);
    return P.periodos?.[m] || {anio, dias:new Date(anio,indice+1,0).getDate(),corte:P.ventas[m].length,cerrado:anio<anioActual || (anio===anioActual && indice<mesActual),faltantes:[]};
  };
  const info=periodo(seleccionado);
  const completo=modo==='completo' && info.cerrado;
  const corte=Math.max(1,Math.min(Number(dia)||info.corte,info.corte,info.dias));
  const valor=(k,m)=>{
    const p=periodo(m), s=P[k]?.[m];
    if(!s?.length || (completo && (!p.cerrado || p.corte<p.dias))) return null;
    const d=completo?p.dias:Math.min(corte,p.dias);
    const v=s[d-1];
    return typeof v==='number' && Number.isFinite(v) && !(p.faltantes || []).includes(d)?v:null;
  };
  const candidatos=meses.slice(0,meses.indexOf(seleccionado)+1);
  const comparables=candidatos.filter(m=>valor('ventas',m)!==null);
  const previos=comparables.filter(m=>m!==seleccionado);
  const total=valor('ventas',seleccionado);
  const promedio=previos.length?previos.reduce((s,m)=>s+valor('ventas',m),0)/previos.length:null;
  const mejor=previos.reduce((a,b)=>a===null || valor('ventas',b)>valor('ventas',a)?b:a,null);
  const anterior=candidatos[candidatos.length-2];
  const puesto=total===null?null:1+previos.filter(m=>valor('ventas',m)>total).length;
  const origenes=comparables.filter(m=>valor('mkt',m)!==null && valor('propio',m)!==null && valor('ventas',m)>0);
  const base=origenes.reduce((s,m)=>s+valor('ventas',m),0);
  const peso=base?origenes.reduce((s,m)=>s+valor('mkt',m),0)/base*100:null;
  return {meses,periodo,info,completo,corte,valor,candidatos,comparables,previos,total,promedio,mejor,anterior,puesto,peso,origenes};
}
(function(){
  const $=id=>document.getElementById(id), nf=new Intl.NumberFormat('es-CO');
  const money=v=>v===null || !Number.isFinite(v)?'Sin dato':'$'+nf.format(Math.round(v));
  const compact=v=>v>=1e6?'$'+(v/1e6).toFixed(1).replace('.',',')+' M':money(v);
  const percent=v=>v===null || !Number.isFinite(v)?'—':v.toFixed(1).replace('.',',')+' %';
  const propio=document.body.dataset.propio;
  let P=window.RIVERA, metric='ventas', selected, mode, day;
  if(!P?.ventas || !Object.keys(P.ventas).length){$('verdict').textContent='No fue posible cargar los datos.';return;}
  function options(){
    const ms=Object.keys(P.ventas);
    if(!ms.includes(selected))selected=ms.at(-1);
    $('periodo').innerHTML=ms.slice().reverse().map(m=>'<option value="'+m+'">'+m+' '+(P.anio||2026)+'</option>').join('');
    $('periodo').value=selected;
  }
  function resetPeriod(){
    const r=resumenPeriodo(P,selected,'dia');
    mode=r.info.cerrado && r.info.corte>=r.info.dias?'completo':'dia';day=r.info.corte;
  }
  const tile=(label,value,detail,cls='')=>'<div class="tile"><div class="tile-h">'+label+'</div><div class="delta '+cls+'">'+value+'</div><div class="tile-f">'+detail+'</div></div>';
  function comparison(label,base,detail,total){
    const d=total!==null && base!==null && base>0?(total-base)/base*100:null;
    return tile(label,d===null?'—':(d>0?'+':'')+percent(d),detail+(base===null?'Sin dato comparable':money(base)),d===null?'':d>=0?'up':'down');
  }
  function render(){
    const R=resumenPeriodo(P,selected,mode,day), v=R.valor, t=R.total;
    const label=R.completo?'Cierre completo':'Al día '+R.corte;
    $('modo').value=mode;$('modo').querySelector('[value="completo"]').disabled=!R.info.cerrado || R.info.corte<R.info.dias;
    $('dia').value=R.corte;$('dia').max=Math.min(R.info.corte,R.info.dias);$('dayControl').hidden=R.completo;
    $('stamp').textContent=selected+' '+R.info.anio+' · '+(R.info.cerrado?'Mes cerrado':'Mes en curso');
    $('verdict').innerHTML=selected+' · <em>'+label.toLowerCase()+'</em>';
    $('heroNum').textContent=money(t);
    $('heroSub').textContent=R.completo?'Ventas del 1 al '+R.info.dias+' de '+selected.toLowerCase():'Ventas del 1 al '+R.corte+' de '+selected.toLowerCase();
    $('rank').textContent=R.puesto===null?'Sin dato para este corte':R.puesto+' de '+R.comparables.length+' meses';
    const warnings=[];
    if(t===null)warnings.push('La hoja no separa este día. Elige otro corte para ver una comparación válida.');
    const excluded=R.candidatos.filter(m=>!R.comparables.includes(m));
    if(excluded.length)warnings.push('Sin dato comparable: '+excluded.join(', ')+'.');
    if(R.info.corte<R.info.dias && R.info.cerrado)warnings.push('El mes está cerrado, pero la hoja solo tiene datos hasta el día '+R.info.corte+'.');
    $('notice').textContent=warnings.join(' ');$('notice').hidden=!warnings.length;
    const mk=v('mkt',selected), pr=v('propio',selected), residual=t!==null && mk!==null && pr!==null?t-mk-pr:null;
    if(t!==null && mk!==null && pr!==null){
      const parts=[['Marketing',mk,'var(--now)'],[propio,pr,'var(--good)']];
      if(residual>0)parts.push(['Otros / por clasificar',residual,'var(--record)']);
      $('split').innerHTML='<div class="split-bar">'+parts.map(([,n,c])=>'<span style="width:'+(t>0?Math.max(0,Math.min(100,n/t*100)):0)+'%;background:'+c+'"></span>').join('')+'</div><div class="split-k">'+parts.map(([name,n,c])=>'<span><i style="background:'+c+'"></i>'+name+' <b>'+money(n)+'</b> · '+percent(t>0?n/t*100:null)+'</span>').join('')+'</div>'+(residual<0?'<p class="warning">Los orígenes superan el total en '+money(-residual)+'. Revisar la hoja.</p>':'');
    }else $('split').innerHTML='<p class="sec-d">El desglose por origen aún no está disponible para este corte.</p>';
    $('operations').textContent='Leads: '+(v('leads',selected)===null?'Sin dato':nf.format(v('leads',selected)))+' · Agendas: '+(v('agend',selected)===null?'Sin dato':nf.format(v('agend',selected)))+' · Meta alcanzada: '+percent(t!==null && P.meta?t/P.meta*100:null);
    $('tiles').innerHTML=comparison('vs. '+(R.anterior||'mes anterior'),R.anterior?v('ventas',R.anterior):null,label+': ',t)+comparison('vs. promedio histórico',R.promedio,R.previos.length+' meses anteriores · ',t)+tile('Peso de marketing',percent(t>0 && mk!==null?mk/t*100:null),'Promedio ponderado: <b>'+percent(R.peso)+'</b> · '+R.origenes.length+' meses comparables');
    $('barsTitle').textContent=R.completo?'Cierres de los meses':'Meses al día '+R.corte;
    $('barsDesc').textContent=R.completo?'Cada mes usa su último día real: 28, 29, 30 o 31.':'Los meses más cortos conservan su cierre al comparar días 29, 30 o 31.';
    const rows=R.comparables.map(m=>({m,n:v('ventas',m)})).sort((a,b)=>b.n-a.n), max=Math.max(1,...rows.map(r=>r.n));
    $('bars').innerHTML=rows.map(r=>'<div class="bar '+(r.m===selected?'hi':'')+'"><span class="bl">'+r.m+'</span><span class="track"><span class="fill" style="width:'+Math.max(0,r.n/max*100)+'%"></span></span><span class="bv">'+money(r.n)+'</span></div>').join('');
    const notes=[R.completo?'Comparación de meses cerrados, usando el total de cada mes.':'Comparación al mismo día del calendario; no se incluyen meses posteriores al seleccionado.'];
    notes.push('El peso de marketing se calcula sobre las ventas totales. El promedio ponderado es la suma de ventas de marketing dividida entre la suma de ventas totales de los '+R.origenes.length+' meses comparables con desglose, incluido el seleccionado.');
    if(residual>0)notes.push('Otros / por clasificar conserva la diferencia entre el total y marketing + '+propio+'. Puede incluir referidos comerciales; no se asigna automáticamente a un origen.');
    if(!R.info.cerrado && t!==null){
      const fracs=R.previos.map(m=>{const s=P.ventas[m],end=s.at(-1);return R.periodo(m).corte>=R.periodo(m).dias && end>0?v('ventas',m)/end:null;}).filter(x=>x!==null && x>0);
      if(fracs.length){const projection=t/(fracs.reduce((a,b)=>a+b,0)/fracs.length);notes.push('Proyección orientativa de cierre: '+money(projection)+', basada en '+fracs.length+' meses anteriores. No es una venta confirmada.');}
    }
    if(R.info.faltantes?.length)notes.push('La hoja agrupa días: '+R.info.faltantes.join(', ')+'. Esos días no se comparan individualmente; el total del grupo se conserva en su último día.');
    $('notes').innerHTML=notes.map((n,i)=>'<div class="note"><span class="k">0'+(i+1)+'</span><span>'+n+'</span></div>').join('');
    $('foot').textContent='Fuente: hoja de ventas · Meta mensual '+money(P.meta)+' · Datos publicados: '+(P.actualizado||'Sin fecha')+' (Colombia). El botón actualizar consulta la última publicación del panel.';
    draw(R);
  }
  function draw(R){
    const svg=$('chart'), ns='http://www.w3.org/2000/svg', cs=getComputedStyle(document.documentElement), color=k=>cs.getPropertyValue(k).trim();
    const add=(name,attrs,text)=>{const e=document.createElementNS(ns,name);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;};
    const fmt=metric==='ventas'?compact:v=>nf.format(Math.round(v));
    const months=($('historial').checked?R.candidatos:[R.anterior,selected]).filter(m=>m && P[metric]?.[m]);
    const series=m=>P[metric][m].slice(0,R.completo?R.periodo(m).dias:Math.min(R.corte,R.periodo(m).dias));
    const values=months.flatMap(series).filter(v=>typeof v==='number');
    const ymax=Math.max(1,...values)*1.1, days=Math.max(2,...months.map(m=>series(m).length)), W=900,H=350,L=80,T=28,IW=740,IH=270;
    const x=d=>L+(d-1)/(days-1)*IW,y=v=>T+IH-v/ymax*IH;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.textContent='';
    add('title',{id:'chartTitle'},'Evolución de '+metric+' · '+selected);
    for(let i=0;i<=4;i++){const val=ymax*i/4;add('line',{x1:L,x2:L+IW,y1:y(val),y2:y(val),stroke:color('--line')});add('text',{x:L-10,y:y(val)+4,'text-anchor':'end',fill:color('--ink-2'),'font-size':11},fmt(val));}
    [...new Set([1,5,10,15,20,25,days].filter(d=>d<=days))].forEach(d=>add('text',{x:x(d),y:T+IH+25,'text-anchor':'middle',fill:color('--ink-2'),'font-size':11},d));
    const colours=m=>m===selected?color('--now'):m===R.anterior?color('--record'):color('--faint');
    months.sort((a,b)=>Number(a===selected)-Number(b===selected)).forEach(m=>{
      let path='',connected=false;
      series(m).forEach((v,i)=>{if(v===null){connected=false;return;}path+=(connected?'L':'M')+x(i+1)+' '+y(v)+' ';connected=true;});
      add('path',{d:path,fill:'none',stroke:colours(m),'stroke-width':m===selected?3:2,'stroke-linejoin':'round'});
      const s=series(m), last=s.at(-1);if(last!==null)add('circle',{cx:x(s.length),cy:y(last),r:4,fill:colours(m)});
    });
    $('legend').innerHTML=months.map(m=>'<span class="lg"><span class="sw" style="background:'+colours(m)+'"></span>'+m+(m===selected?' · seleccionado':'')+'</span>').join('');
    $('chartDesc').textContent=R.completo?'Acumulado hasta el último día de cada mes.':'Acumulado hasta el día '+R.corte+'. Cambia la métrica o muestra el historial.';
    const cross=add('line',{x1:0,x2:0,y1:T,y2:T+IH,stroke:color('--ink-3'),opacity:0});
    const hit=add('rect',{x:L,y:T,width:IW,height:IH,fill:'transparent'}),tip=$('tip');
    hit.addEventListener('pointermove',event=>{
      const rect=svg.getBoundingClientRect(),d=Math.max(1,Math.min(days,Math.round(((event.clientX-rect.left)/rect.width*W-L)/IW*(days-1))+1));
      cross.setAttribute('x1',x(d));cross.setAttribute('x2',x(d));cross.setAttribute('opacity','.5');
      tip.innerHTML='<div class="th">Día '+d+'</div>'+months.map(m=>{const val=series(m)[d-1];return '<div class="tr"><span>'+m+'</span><b>'+(val===null || val===undefined?'Sin dato':fmt(val))+'</b></div>';}).join('');
      tip.style.left=Math.min(Math.max(event.clientX-rect.left+12,8),Math.max(8,rect.width-240))+'px';tip.style.top='30px';tip.style.opacity=1;
    });
    hit.addEventListener('pointerleave',()=>{tip.style.opacity=0;cross.setAttribute('opacity',0);});
  }
  options();resetPeriod();render();
  $('periodo').addEventListener('change',()=>{selected=$('periodo').value;resetPeriod();render();});
  $('modo').addEventListener('change',()=>{mode=$('modo').value;render();});
  $('dia').addEventListener('change',()=>{day=Number($('dia').value);render();});
  $('historial').addEventListener('change',render);
  document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{metric=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));
  $('capture').addEventListener('click',()=>{const active=document.body.classList.toggle('capture');$('capture').textContent=active?'Salir de vista captura':'Vista para captura';$('capture').setAttribute('aria-pressed',String(active));});
  $('refresh').addEventListener('click',()=>{
    const b=$('refresh');b.disabled=true;$('status').textContent='Consultando la última publicación…';
    const s=document.createElement('script');s.src='data.js?t='+Date.now();
    const finish=()=>{b.disabled=false;s.remove();};
    s.onload=()=>{const before=P.actualizado;P=window.RIVERA;options();render();$('status').textContent=P.actualizado===before?'Consultado ahora: no hay una publicación más reciente.':'Datos publicados actualizados.';finish();};
    s.onerror=()=>{$('status').textContent='No se pudo actualizar. Se conservan los datos visibles.';finish();};document.head.appendChild(s);
  });
})();

</script>
